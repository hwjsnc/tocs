[package]
name = "sql_conv"
version = "0.2.0"
edition = "2021"
publish = false

[[bin]]
name = "sql_conv"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "4.0.26", features = ["derive"] }
indexmap = "1.9.2"
log = { version = "0.4.17" }
rusqlite = { version = "0.29", features = ["bundled"] }
walkdir = "2.3.2"
tocs = { path = "../tocs", features = ["rusqlite", "pkg"] }
simple_logger = { version = "4", default-features = false, features = ["stderr"] }
smol_str = { version = "0.2", default-features = false }
