[package]
name = "sql_conv"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "sql_conv"
path = "src/main.rs"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
clap = { version = "3.2.6", features = ["derive"] }
indexmap = "1.9.1"
rusqlite = "0.27"
walkdir = "2.3"
tocs = { path = "../tocs", features = ["rusqlite", "sqliteio"] }
smol_str = { version = "0.1.23", default-features = false }
sqliteio = { path = "../tocs_internal/sqliteio" }
sqliteio_derive = { path = "../tocs_internal/sqliteio_derive" }
