image: archlinux
packages:
  - mingw-w64-headers
  - mingw-w64-gcc
  - rustup
sources:
  - https://git.sr.ht/~quf/tocs
artifacts:
  - tocs/tbled/target/x86_64-pc-windows-gnu/release/tbled.exe
  - tocs/pkgtool/target/x86_64-pc-windows-gnu/release/pkgtool.exe
tasks:
 - install-install-toolchain: |
    rustup install stable
    rustup target add x86_64-pc-windows-gnu
 - build-tbled: |
    cd tocs/tbled
    cargo build --release --locked --target x86_64-pc-windows-gnu
 - build-pkgtool: |
    cd tocs/pkgtool
    cargo build --release --locked --target x86_64-pc-windows-gnu
