image: archlinux
packages:
  - mingw-w64
  - rustup
sources:
  - https://git.sr.ht/~quf/tocs
artifacts:
  - tocs/tbled/target/x86_64-pc-windows-gnu/release/tbled.exe
  - tocs/pktool/target/x86_64-pc-windows-gnu/release/pktool.exe
tasks:
 - install-install-toolchain: |
    rustup install stable
    #rustup toolchain install --force-non-host stable-x86_64-pc-windows-gnu
    rustup target add x86_64-pc-windows-gnu
 - build-tbled: |
    cd tocs/tbled
    cargo build --release --target x86_64-pc-windows-gnu
 - build-pkgtool: |
    cd tocs/pkgtool
    cargo build --release --target x86_64-pc-windows-gnu
