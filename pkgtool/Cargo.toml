[package]
name = "pkgtool"
version = "1.0.0"
edition = "2021"
description = "pkgtool handles .pkg and .pka files from the Trails of Cold Steel games"
publish = false

[profile.dev]
opt-level = 1

[profile.release]
strip = true
opt-level = 3
lto = true

[dependencies]
ahash = { version = "0.8.7", default-features = false } # avoid syn
anyhow = "1.0.66"
clap = { version = "4.0.26", features = ["derive"] }
csv = { version = "1.1.6" }
fallible-iterator = "0.2"
hexhex = { git = "https://git.sr.ht/~quf/hexhex", version = "1.0.0" }
log = "0.4.17"
misc = { path = "../misc" }
rayon = "1.7"
sha2 = "0.10.6"
simple_logger = { version = "4", default-features = false }
tocs = { path = "../tocs", features = ["default", "pkg"] }
walkdir = "2.3.2"
