[package]
name = "pkgtool"
version = "0.1.0"
edition = "2021"
description = "pkgtool handles .pkg and .pka files from the Trails of Cold Steel games"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0.66"
clap = { version = "4.0.26", features = ["derive"] }
csv = { version = "1.1.6" }
hex = "0.4.3"
log = "0.4.17"
rayon = "1.6"
sha2 = "0.10.6"
simple_logger = { version = "4", default-features = false }
tocs = { path = "../tocs", features = ["default", "pkg"] }
walkdir = "2.3.2"
