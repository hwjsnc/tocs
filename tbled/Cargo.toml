[package]
name = "tbled"
version = "1.0.0-rc3"
edition = "2021"
publish = false

[profile.release]
strip = true
opt-level = "s"
lto = true

[dependencies]
clap = { version = "4.0.26", features = ["derive"] }
csv = { version = "1.1.6" }
indexmap = "1.9.2"
fltk = { version = "1.4.2", features = ["no-images", "no-pango"] }
grid = "0.10.0"
lazy_static = "1.4"
log = { version = "0.4.17" }
native-dialog="0.6.3"
regex = "1.8.1"
serde_json = { version = "1.0.96", features = ["preserve_order"] }
simple_logger = { version = "4", default-features = false, features = ["stderr"] }
smol_str = { version = "0.2", default-features = false }
tocs = { path = "../tocs", features = ["serde"] }

[dev-dependencies]
hexhex = { git = "https://git.sr.ht/~quf/hexhex", version = "1.0.0" }
