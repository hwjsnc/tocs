[package]
name = "tbled"
version = "0.5.0"
edition = "2021"
publish = false

[dependencies]
clap = { version = "4.0.26", features = ["derive"] }
csv = { version = "1.1.6" }
indexmap = "1.9.2"
fltk = { version = "1.4.2", features = ["fltk-bundled"] }
grid = "0.10.0"
lazy_static = "1.4"
log = { version = "0.4.17" }
native-dialog="0.6.3"
regex = "1.8.1"
simple_logger = { version = "4", default-features = false, features = ["stderr"] }
smol_str = { version = "0.2", default-features = false }
tocs = { path = "../tocs" }

[dev-dependencies]
hex = "0.4.3"
