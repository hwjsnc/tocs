[package]
name = "tbled"
version = "1.0.0-rc4"
edition = "2021"
publish = false

[profile.release]
strip = true
opt-level = "s"
lto = true

[dependencies]
camino = "1.1.6"
clap = { version = "4.0.26", features = ["derive"] }
csv = { version = "1.1.6" }
indexmap = "1.9.2"
ecow = { version = "0.1.2", default-features = false }
fltk = { version = "1.4.11", features = ["no-images", "no-pango"] }
grid = "0.10.0"
lazy_static = "1.4"
log = { version = "0.4.17" }
native-dialog="0.6.3"
regex = "1.8.1"
serde = "1.0.163, <= 1.0.171"
serde_json = { version = "1.0.96, <=1.0.96", features = ["preserve_order"] }
simple_logger = { version = "4", default-features = false, features = ["stderr"] }
tocs = { path = "../tocs", default-features = false, features = ["json"] }

[dev-dependencies]
hexhex = { git = "https://git.sr.ht/~quf/hexhex", version = "1.0.0" }
