[package]
name = "tocs"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "tocs"
path = "src/lib.rs"

[features]
default = ["private-tests", "pkg"]
private-tests = ["dep:simple_logger"]
rusqlite = ["dep:rusqlite"]
pkg = ["compression", "dep:fallible-iterator", "dep:sha2"]
compression = ["dep:lz4", "dep:zstd", "dep:hashbrown"]
proptest = ["dep:proptest"]

[dependencies]
bitvec = "1.0.1"
lazy_static = "1.4"
log = "0.4.17"
lz4 = { version = "1.24.0", optional = true }
blake2 = "0.10.5"
fallible-iterator = { version = "0.2", optional = true }
hashbrown = { version = "0.13.1", optional = true }
hex = "0.4.3"
hex-literal = "0.4.1"
indexmap = "1.9.2"
itertools = "0.10.5"
num-integer = "0.1.45"
sha2 = { version = "0.10.6", optional = true }
smallvec = { version = "1.10.0", features = ["write"] }
smol_str = { version = "0.2", default-features = false }
rusqlite = { version = "0.29", optional = true }
zstd = { version = "0.12.3", optional = true }

# these should be dev dependencies, but cargo doesn't like that
simple_logger = { version = "4", default-features = false, features = ["stderr"], optional = true }
proptest = { version = "1.1", optional = true }

[dev-dependencies]
walkdir = "2.3.2"
tempfile = "3.3"
