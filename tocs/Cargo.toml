[package]
name = "tocs"
version = "0.1.0"
edition = "2021"

[lib]
name = "tocs"
path = "src/lib.rs"

[features]
default = ["private-tests", "pkg"]
private-tests = ["simple_logger"] # test bit-identical roundtrip of tbl data
rusqlite = ["dep:rusqlite"]
pkg = ["compression"]
compression = ["dep:lz4", "dep:zstd"]

[dependencies]
lazy_static = "1.4"
log = "0.4.17"
lz4 = { version = "1.24.0", optional = true }
blake2 = "0.10.4"
hex = "0.4.3"
hex-literal = "0.3.4"
indexmap = "1.9.1"
itertools = "0.10.4"
simple_logger = { version = "1", default-features = false, features = ["stderr"], optional = true }
smallvec = "1.9.0"
smol_str = { version = "0.1.23", default-features = false }
rusqlite = { version = "0.27", optional = true }
zstd = { version = "0.11.2", optional = true }


[dev-dependencies]
walkdir = "2.3"
