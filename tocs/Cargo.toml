[package]
name = "tocs"
version = "0.1.0"
edition = "2021"

[lib]
name = "tocs"
path = "src/lib.rs"

[features]
default = ["roundtrip-cs1", "roundtrip-cs2", "roundtrip-cs3"]
roundtrip-cs1 = ["simple_logger"] # test bit-identical roundtrip (read -> write) for cs1.
roundtrip-cs2 = ["simple_logger"] # test bit-identical roundtrip (read -> write) for cs2.
roundtrip-cs3 = ["simple_logger"] # test bit-identical roundtrip (read -> write) for cs3.
rusqlite = ["dep:rusqlite"]

[dependencies]
lazy_static = "1.4"
log = "0.4.17"
blake2 = "0.10.4"
hex = "0.4.3"
hex-literal = "0.3.4"
indexmap = "1.9.1"
ioutil = { path = "../tocs_internal/ioutil" }
tbl_deserialize_derive = { path = "../tocs_internal/tbl_deserialize_derive" }
tbl_serialize_derive = { path = "../tocs_internal/tbl_serialize_derive" }
tbl_serialize_length_derive = { path = "../tocs_internal/tbl_serialize_length_derive" }
simple_logger = { version = "1", default-features = false, features = ["stderr"], optional = true }
sjis = { path = "../tocs_internal/sjis" }
smallvec = "1.9.0"
smol_str = { version = "0.1.23", default-features = false }
rusqlite = { version = "0.27", optional = true }


[dev-dependencies]
walkdir = "2.3"
