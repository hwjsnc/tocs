[package]
name = "tocs"
version = "0.1.0"
edition = "2021"

[lib]
name = "tocs"
path = "src/lib.rs"

[features]
default = ["roundtrip-cs1", "roundtrip-cs2", "roundtrip-cs3"]
roundtrip-cs1 = [] # test bit-identical roundtrip (read -> write) for cs1.
roundtrip-cs2 = [] # test bit-identical roundtrip (read -> write) for cs2.
roundtrip-cs3 = [] # test bit-identical roundtrip (read -> write) for cs3.

[dependencies]
lazy_static = "1.4"
blake2 = "0.10.4"
hex-literal = "0.3.4"
ioutil = { path = "../tocs_internal/ioutil" }
tbl_serialize_derive = { path = "../tocs_internal/tbl_serialize_derive" }
tbl_serialize_length_derive = { path = "../tocs_internal/tbl_serialize_length_derive" }


[dev-dependencies]
walkdir = "2.3"
